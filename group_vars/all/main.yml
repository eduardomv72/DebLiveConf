---
# =====================================================================
#  CONFIGURACIÓN GLOBAL - aquí es donde personalizas todo
# =====================================================================

# --- Repositorio (lo usa el script sync-config) ---
repo_url: "https://github.com/eduardomv72/DebLiveConf.git"
repo_branch: main
repo_playbook: main.yml

# --- Usuario del sistema live ---
live_user: user

# --- Localización ---
timezone: Europe/Madrid
locale_default: en_US.UTF-8
locales_generate:
  - es_ES.UTF-8
  - en_US.UTF-8
keyboard_model: pc105
keyboard_layout: es
keyboard_variant: ""
keyboard_options: ""
system_hostname: deb13live

# --- Red ---
wifi_country: ES
# Las redes wifi (con contraseña) NO van aquí: se definen cifradas en
# group_vars/all/vault.yml (ver vault.yml.example).
wifi_networks: []

# --- Paquetes ---
# Revisa siempre con:  sudo apt -s remove <paquete>   y   --check --diff
packages_remove:
  - gnome-maps
  - gnome-weather
  - gnome-contacts
  - gnome-calendar
  - gnome-music
  - gnome-characters
  - gnome-tour
  - simple-scan
  - yelp
  - evolution
  - libreoffice*
  - firefox
  - shotwell
  - mozc-*
  
  
packages_purge: false
packages_autoremove: false      # true puede arrastrar paquetes inesperados en un live

packages_install_recommends: false
packages_install:
  - git
  - gh
  - curl
  - wget
  - vim
  - tmux
  - htop
  - tree
  - jq
  - rsync
  - unzip
  - ripgrep
  - bash-completion
  - openssh-client
  - network-manager
  - dconf-cli
  - python3-psutil
  - gnome-tweaks
  - fonts-firacode
  - sqlitebrowser

# Si alguno falla (nombre distinto o no disponible) solo se avisa, no se detiene el playbook.
packages_install_optional:
  - gnome-shell-extension-manager
  - gnome-shell-extension-dashtodock
  - gnome-shell-extension-appindicator
  - gnome-shell-extension-caffeine

# --- Git y SSH ---
git_user_name: ""
git_user_email: ""
ssh_private_key: ""     # se rellena desde vault.yml

# --- Ajustes de GNOME (formato GVariant, igual que 'dconf dump') ---
# Estructura:  ruta/dconf:  clave: valor
# Cadenas entre comillas simples dentro de comillas dobles. Booleanos y números, tal cual.
# Para ver el valor exacto de un ajuste:   dconf dump /   o   gsettings get <esquema> <clave>
gnome_settings:
  org/gnome/desktop/interface:
    color-scheme: "'prefer-dark'"
    clock-show-weekday: true
    enable-hot-corners: false
    show-battery-percentage: true
  org/gnome/desktop/input-sources:
    sources: "[('xkb', '{{ keyboard_layout }}{{ '+' ~ keyboard_variant if keyboard_variant else '' }}'), ('xkb', 'us')]"
  org/gnome/desktop/wm/preferences:
    button-layout: "'appmenu:minimize,maximize,close'"
  org/gnome/desktop/peripherals/touchpad:
    tap-to-click: true
    natural-scroll: false
  org/gnome/desktop/session:
    idle-delay: "uint32 0"
  org/gnome/desktop/screensaver:
    lock-enabled: false
  org/gnome/settings-daemon/plugins/power:
    sleep-inactive-ac-type: "'nothing'"
  org/gnome/mutter:
    dynamic-workspaces: true
    edge-tiling: true
  org/gnome/nautilus/preferences:
    default-folder-viewer: "'list-view'"
  org/gnome/shell:
    favorite-apps: "['org.gnome.Nautilus.desktop', 'google-chrome.desktop', 'code.desktop', 'org.gnome.Terminal.desktop']"
    enabled-extensions: "['dash-to-dock@micxgx.gmail.com', 'appindicatorsupport@rgcjonas.gmail.com']"
  org/gnome/shell/extensions/dash-to-dock:
    dock-position: "'BOTTOM'"
    extend-height: false
    dash-max-icon-size: 40
  # Fondo de pantalla (ejemplo):
  # org/gnome/desktop/background:
  #   picture-uri: "'file:///usr/share/backgrounds/gnome/adwaita-l.jxl'"

# El live guarda sus propias fuentes de entrada en la base del usuario;
# se borran para que se apliquen las de gnome_settings.
gnome_reset_user_keys:
  - /org/gnome/desktop/input-sources/sources
  - /org/gnome/desktop/input-sources/mru-sources
  
install_google_chrome: true
install_vscode: true
install_claude_code: true
install_claude_desktop: true



