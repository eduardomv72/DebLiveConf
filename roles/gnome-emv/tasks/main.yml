- name: Instalar Dash to Dock
  ansible.builtin.apt:
    name: gnome-shell-extension-dash-to-dock
    state: present
    update_cache: true

- name: Override de GSettings para activar la extensión
  ansible.builtin.copy:
    dest: /usr/share/glib-2.0/schemas/90_dash-to-dock.gschema.override
    content: |
      [org.gnome.shell]
      enabled-extensions=['dash-to-dock@micxgx.gmail.com']
    mode: "0644"
#  notify: Compilar esquemas

# handlers
- name: Compilar esquemas
  ansible.builtin.command: glib-compile-schemas /usr/share/glib-2.0/schemas/
