---
# Los ajustes se aplican como valores por defecto del sistema (dconf system-db),
# así no hace falta una sesión gráfica abierta ni DBus del usuario.
- name: Instalar dconf
  ansible.builtin.apt:
    name: dconf-cli
    state: present

- name: Perfil dconf (base de usuario + base local del sistema)
  ansible.builtin.copy:
    dest: /etc/dconf/profile/user
    content: |
      user-db:user
      system-db:local
    mode: "0644"
  notify: Actualizar dconf

- name: Directorio de ajustes locales
  ansible.builtin.file:
    path: /etc/dconf/db/local.d
    state: directory
    mode: "0755"

- name: Escribir ajustes de GNOME
  ansible.builtin.template:
    src: dconf-local.j2
    dest: /etc/dconf/db/local.d/00-live-defaults
    mode: "0644"
  notify: Actualizar dconf

- name: Aplicar ajustes ahora
  ansible.builtin.meta: flush_handlers

# dconf escribe a través del bus de D-Bus de la sesión; sin sesión abierta no se puede.
- name: Comprobar si el usuario tiene sesión abierta
  ansible.builtin.stat:
    path: "/run/user/{{ live_uid }}/bus"
  register: gnome_user_bus

# 'dconf read' devuelve el valor del sistema si el usuario no tiene uno propio,
# así que solo se borra cuando difiere del valor por defecto ('dconf read -d').
- name: Quitar valores del usuario que tapan los del sistema
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - '[ "$(dconf read "$1")" = "$(dconf read -d "$1")" ] || { dconf reset "$1" && echo reset; }'
      - sh
      - "{{ item }}"
  loop: "{{ gnome_reset_user_keys }}"
  register: gnome_reset_result
  changed_when: "'reset' in gnome_reset_result.stdout"
  become: true
  become_user: "{{ live_user }}"
  environment:
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ live_uid }}/bus"
  when: gnome_user_bus.stat.exists
