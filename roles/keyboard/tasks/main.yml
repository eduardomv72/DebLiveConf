---
- name: Instalar los paquetes de configuración del teclado
  ansible.builtin.apt:
    name:
      - keyboard-configuration
      - console-setup
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configurar la distribución del teclado del sistema
  ansible.builtin.template:
    src: keyboard.j2
    dest: /etc/default/keyboard
    mode: "0644"
  notify: Aplicar teclado en la consola

- name: Obtener el UID del usuario de escritorio
  ansible.builtin.getent:
    database: passwd
    key: "{{ keyboard_desktop_user }}"

- name: Comprobar si el usuario tiene una sesión gráfica abierta
  ansible.builtin.stat:
    path: "/run/user/{{ ansible_facts.getent_passwd[keyboard_desktop_user][1] }}/bus"
  register: keyboard_session_bus

- name: Configurar la distribución del teclado en GNOME
  community.general.dconf:
    key: /org/gnome/desktop/input-sources/sources
    value: "{{ keyboard_gnome_sources }}"
    state: present
  become_user: "{{ keyboard_desktop_user }}"
  environment: >-
    {{ {'DBUS_SESSION_BUS_ADDRESS': 'unix:path=' ~ keyboard_session_bus.stat.path}
       if keyboard_session_bus.stat.exists else {} }}

- name: Usar la primera fuente de entrada como activa
  community.general.dconf:
    key: /org/gnome/desktop/input-sources/current
    value: "uint32 0"
    state: present
  become_user: "{{ keyboard_desktop_user }}"
  environment: >-
    {{ {'DBUS_SESSION_BUS_ADDRESS': 'unix:path=' ~ keyboard_session_bus.stat.path}
       if keyboard_session_bus.stat.exists else {} }}
